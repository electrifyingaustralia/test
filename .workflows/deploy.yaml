
name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Deploy React Frontend"
        type: boolean
        required: true
        default: true

      deploy_backend:
        description: "Deploy .NET Backend"
        type: boolean
        required: true
        default: false

      run_migrations:
        description: "Run Database Migrations"
        type: boolean
        required: true
        default: false

      rebuild_images:
        description: "Rebuild Docker Images"
        type: boolean
        required: true
        default: true

      environment:
        description: "Select Environment"
        type: choice
        required: true
        options:
          - development
          - staging
          - production
        default: development

      image_tag:
        description: "Docker Image Tag"
        type: string
        required: true
        default: latest

      confirm_deployment:
        description: "Type DEPLOY to confirm"
        type: string
        required: true
        default: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Deployment
        env:
          CONFIRM: ${{ inputs.confirm_deployment }}
          FRONTEND: ${{ inputs.deploy_frontend }}
          BACKEND: ${{ inputs.deploy_backend }}
          TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "Deployment confirmation failed"
            exit 1
          fi

          if [ "$FRONTEND" != "true" ] && [ "$BACKEND" != "true" ]; then
            echo "Select at least one service"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "Invalid Docker image tag"
            exit 1
          fi

          echo "Deployment inputs validated"

  frontend:
    needs: validate
    if: ${{ inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          REBUILD: ${{ inputs.rebuild_images }}
        run: |
          echo "Frontend deployment started"
          echo "Environment: $ENVIRONMENT"
          echo "Image tag: $IMAGE_TAG"
          echo "Rebuild: $REBUILD"
          # Add Docker build and push commands here
          # Add SSH deployment commands here

  backend:
    needs: validate
    if: ${{ inputs.deploy_backend }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          REBUILD: ${{ inputs.rebuild_images }}
        run: |
          echo "Backend deployment started"
          echo "Environment: $ENVIRONMENT"
          echo "Image tag: $IMAGE_TAG"
          echo "Rebuild: $REBUILD"
          # Add Docker build and push commands here
          # Add SSH deployment commands here

  migration:
    needs: validate
    if: ${{ inputs.run_migrations && inputs.deploy_backend }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Database Migration
        run: |
          echo "Run database migration for ${{ inputs.environment }}"
          # Add your migration job here
